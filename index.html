<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>WebXR – palm.glb</title>
<style>
body { margin: 0; overflow: hidden; }
</style>
</head>
<body>

<h3 style="position:absolute;z-index:10;color:white;background:black;padding:5px">
  Kliknij ENTER AR → trigger = dodaj palmę
</h3>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
import { ARButton } from 'https://unpkg.com/three@0.158.0/examples/jsm/webxr/ARButton.js';

let scene, camera, renderer, controller;
let model;

scene = new THREE.Scene();
camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 20);

renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

// AR button
document.body.appendChild(ARButton.createButton(renderer, {requiredFeatures:['hit-test']}));

// światło
scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

// kontroler
controller = renderer.xr.getController(0);
controller.addEventListener('select', spawnModel);
scene.add(controller);

// loader
const loader = new GLTFLoader();
loader.load('palm.glb', (gltf) => {
    model = gltf.scene;
    model.scale.set(0.3, 0.3, 0.3); // ← możesz zmienić
    console.log("MODEL ZAŁADOWANY ✅");
}, undefined, (e)=>{
    console.error("BŁĄD MODEL:", e)
});

// dodawanie palmy w AR
function spawnModel(){
  if (!model) return;

  const clone = model.clone();
  clone.position.set(0, 0, -1);
  controller.add(clone);
}

renderer.setAnimationLoop(()=>{
  renderer.render(scene, camera);
});

</script>
</body>
</html>
