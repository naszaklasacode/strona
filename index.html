<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>VR Game Android / Meta Quest</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';
import { XRControllerModelFactory } from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/webxr/XRControllerModelFactory.js';
import { XRHandModelFactory } from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/webxr/XRHandModelFactory.js';
import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/webxr/VRButton.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// Kamera
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);
camera.position.set(0, 1.6, 3);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

// VR Button
document.body.appendChild(VRButton.createButton(renderer));

// Światło
const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
scene.add(light);

// Podłoga
const floorGeometry = new THREE.PlaneGeometry(10, 10);
const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x228822 });
const floor = new THREE.Mesh(floorGeometry, floorMaterial);
floor.rotation.x = -Math.PI/2;
floor.position.y = 0;
scene.add(floor);

// Ściany pokoju
const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x888888, side: THREE.DoubleSide });
const wallGeometryX = new THREE.PlaneGeometry(10, 3); // szerokość, wysokość
const wallGeometryZ = new THREE.PlaneGeometry(10, 3);

const wallLeft = new THREE.Mesh(wallGeometryX, wallMaterial);
wallLeft.position.set(-5, 1.5, 0);
wallLeft.rotation.y = Math.PI / 2;
scene.add(wallLeft);

const wallRight = new THREE.Mesh(wallGeometryX, wallMaterial);
wallRight.position.set(5, 1.5, 0);
wallRight.rotation.y = -Math.PI / 2;
scene.add(wallRight);

const wallFront = new THREE.Mesh(wallGeometryZ, wallMaterial);
wallFront.position.set(0, 1.5, -5);
scene.add(wallFront);

const wallBack = new THREE.Mesh(wallGeometryZ, wallMaterial);
wallBack.position.set(0, 1.5, 5);
wallBack.rotation.y = Math.PI;
scene.add(wallBack);

// Kontrolery / ręce VR
const controllerModelFactory = new XRControllerModelFactory();
const handModelFactory = new XRHandModelFactory();

const controllers = [];
for(let i=0;i<2;i++){
  const controller = renderer.xr.getController(i);
  scene.add(controller);
  controllers.push(controller);

  const grip = renderer.xr.getControllerGrip(i);
  grip.add(controllerModelFactory.createControllerModel(grip));
  scene.add(grip);

  // wirtualne ręce
  const hand = renderer.xr.getHand(i);
  hand.add(handModelFactory.createHandModel(hand, "mesh"));
  scene.add(hand);
}

// Prosta animacja
function animate(){
  renderer.setAnimationLoop(render);
}

function render(){
  renderer.render(scene, camera);
}

// Resize
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
